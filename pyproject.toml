[project]
name = "issfm"
version = "0.1.0"
description = "Improved Training of Strong Stochastic Flow Maps (iSSFM)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "lightning>=2.0.0",
    "torchmetrics[image]>=1.0.0",
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "rootutils>=1.0.0",
    "rich>=13.0.0",
    "tqdm>=4.67.0",
    "einops>=0.8.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.0",
    "matplotlib>=3.9.0",
    "contourpy>=1.3",
    "wandb>=0.25.1",
    # ImageNet data preparation, SD-VAE and pretrained checkpoints
    "datasets>=4.0.0",
    "pyarrow>=15.0",
    "diffusers>=0.39.0,<0.40",
    "safetensors>=0.8.0",
    "huggingface-hub>=0.34.0,<2.0",
    "hf>=1.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/*"]

# -- uv ------------------------------------------------------------------
[tool.uv.sources]
torch = { index = "pytorch-cu13" }
torchvision = { index = "pytorch-cu13" }

[[tool.uv.index]]
name = "pytorch-cu13"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
