defaults:
  - model_checkpoint
  - step_checkpoint
  - model_summary
  - rich_progress_bar
  - sample_grid
  - loss_heatmap
  - strong_convergence
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "train/loss"
  mode: "min"
  save_last: True
  auto_insert_metric_name: False

step_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "step_{step:06d}"

model_summary:
  max_depth: -1
