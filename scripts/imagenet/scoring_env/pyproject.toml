[project]
name = "issfm-imagenet-scoring"
version = "0.1.0"
description = "Pinned environment for scoring ImageNet samples (FID, FD-DINOv2, ImageReward, PickScore, HPSv2.1)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "numpy<2",
    "pillow",
    "tqdm",
    "huggingface-hub>=0.23,<0.26",
    # ImageReward's vendored BLIP needs old transformers / timm.
    "image-reward==1.5",
    "clip @ https://github.com/openai/CLIP/archive/refs/heads/main.zip",
    "transformers==4.30.2",
    "timm==0.6.13",
    "fairscale==0.4.13",
    # image-reward imports datasets (via diffusers); old datasets needs pyarrow<15.
    "pyarrow<15",
    "diffusers==0.20.2",
    "accelerate==0.21.0",
    # HPSv2.1 through standalone open_clip (avoids hpsv2's vendored fork / BPE bug).
    "open-clip-torch==2.24.0",
    # FID (torchmetrics + torch-fidelity Inception, same pins as the main env) and
    # scipy for the Frechet sqrtm, so one script scores every metric.
    "torchmetrics[image]==1.9.0",
    "torch-fidelity==0.4.0",
    "scipy<1.14",
]

[tool.uv]
package = false
override-dependencies = ["setuptools<70"]
